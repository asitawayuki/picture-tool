name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # webkit2gtk-4.1 / libsoup-3.0 が標準リポジトリで手に入る最古の LTS に合わせる
    runs-on: ubuntu-22.04

    # core の AVIF デコーダ（libdav1d）は内部ビルドする。22.04 の apt の libdav1d は 1.3 未満で
    # 使えない。内部ビルドなら Windows と同じ仕組みを CI が毎回通す（meson・ninja・nasm が要る）
    env:
      SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: always

    steps:
      - uses: actions/checkout@v7

      # gui クレート（Tauri v2）を Linux でビルドするために必須。
      # meson・ninja-build・nasm は libdav1d の内部ビルド（x86_64 のアセンブリ）用
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            nasm \
            meson \
            ninja-build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install frontend dependencies
        working-directory: gui-frontend
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: gui-frontend
        run: bun run typecheck

      # 純粋ロジックの単体テスト。走査範囲は bunfig.toml で src/ に限定してある。
      # Playwright（e2e）はブラウザバイナリを入れていないので CI では走らせない
      - name: Test frontend
        working-directory: gui-frontend
        run: bun test

      # tauri-build は frontendDist (../gui-frontend/dist) の存在を要求するため、
      # gui クレートに触れる cargo コマンドより前に必ずビルドしておく
      - name: Build frontend
        working-directory: gui-frontend
        run: bun run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
