[workspace]
members = ["core", "cli", "gui"]
resolver = "2"

[workspace.package]
license = "MIT"

# 複数クレートが使う依存はここでバージョンを固定し、各クレートは
# `.workspace = true` で継承する。個別記述だと片方だけ上げたときに
# 同じクレートの2バージョンが同時にリンクされる（S6-M19）。
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

# 配布バイナリの最適化（S6-L15）。CJK フォントを同梱するぶん元が大きいので効果が大きい。
[profile.release]
lto = true
codegen-units = 1
strip = true
