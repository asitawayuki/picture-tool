[package]
name = "picture-tool-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["bundled-font"]
# 同梱の CJK フォント（約4MB）をバイナリに埋め込む。
# 切ると Exif フレームは font_path を明示した場合のみ描画できる。
bundled-font = []
# 公開 enum に `clap::ValueEnum` を derive する。CLI がモードの enum を
# 複製せずに済ませるためのもの（S6-CLI-3）。GUI/ライブラリ利用では不要。
clap = ["dep:clap"]

[dependencies]
image = "0.24"
ab_glyph = "0.2"
resvg = "0.37"
usvg = "0.37"
rust-embed = { version = "8", features = ["include-exclude"] }
dirs = "5"
rayon = "1.10"
walkdir = "2.5"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
base64 = "0.22"
kamadak-exif = "0.5"

[dev-dependencies]
tempfile = "3"
# 統合テストから base64 のプレビュー出力をデコードして検証するため
base64 = "0.22"
