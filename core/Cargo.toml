[package]
name = "picture-tool-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["bundled-font"]
# 同梱の CJK フォント（約4MB）をバイナリに埋め込む。
# 切ると Exif フレームは font_path を明示した場合のみ描画できる。
bundled-font = []
# 公開 enum に `clap::ValueEnum` を derive する。CLI がモードの enum を
# 複製せずに済ませるためのもの（S6-CLI-3）。GUI/ライブラリ利用では不要。
clap = ["dep:clap"]

[dependencies]
image.workspace = true
ab_glyph = "0.2"
resvg = "0.48"
usvg = "0.48"
rust-embed = { version = "8", features = ["include-exclude"] }
dirs = "7"
rayon.workspace = true
walkdir = "2.5"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
base64 = "0.23"
kamadak-exif = "0.6"
# メタデータ編集（spec 2026-08-18）。どちらも 1.0 未満で更新頻度が緩やかなため
# バージョンを固定する。API 破壊的変更とメンテナンス停滞のリスクを見込んでのこと。
little_exif = "=0.6.23"
img-parts = "=0.4.0"
# XMP パケット内をプロパティ単位で差し替えるためのパーサ。
# **0.37 系であることが重要**: little_exif 0.6.23 が quick-xml 0.37.5 に依存しており、
# 0.42 を足すと同じクレートの 2 版が同時にリンクされる（workspace Cargo.toml の S6-M19）。
quick-xml = "0.37"
# 入力専用の JPEG XL / AVIF デコーダ。どちらも純 Rust（C ライブラリ不要）。
# jxl-oxide の `image` は image::ImageDecoder 実装を有効にする。`rayon` は入れない
# （1 枚の中は並列にしない。理由は core/src/decode/mod.rs の `jxl_decoder`）
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
# x86/x86_64 では内部の rav1d がアセンブリを使うため **ビルドに nasm が要る**（README）。
# 既定の `binary` は CLI 用の PNG 出力で、ライブラリ利用には不要
avif-decode = { version = "3", default-features = false }
# AVIF の画像データと色深度を取り出すため（avif-decode が内部で使う版と揃える）
avif-parse = "2"
# JPEG XL の Brotli 圧縮 Exif（`brob`）を上限つきで展開するため（jxl-oxide が使う版と揃える）
brotli-decompressor = "5"

[dev-dependencies]
tempfile = "3"
# spike（tests/rating_scan_spike.rs）でページキャッシュを落とすための posix_fadvise。
# **dev-dependency 限定**で、配布物には入らない
libc = "0.2"
# 統合テストから base64 のプレビュー出力をデコードして検証するため
base64 = "0.23"
