[package]
name = "picture-tool-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["bundled-font"]
# 同梱の CJK フォント（約4MB）をバイナリに埋め込む。
# 切ると Exif フレームは font_path を明示した場合のみ描画できる。
bundled-font = []
# 公開 enum に `clap::ValueEnum` を derive する。CLI がモードの enum を
# 複製せずに済ませるためのもの（S6-CLI-3）。GUI/ライブラリ利用では不要。
clap = ["dep:clap"]

[dependencies]
image.workspace = true
ab_glyph = "0.2"
resvg = "0.48"
usvg = "0.48"
rust-embed = { version = "8", features = ["include-exclude"] }
dirs = "7"
rayon.workspace = true
walkdir = "2.5"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
base64 = "0.23"
kamadak-exif = "0.6"
# メタデータ編集（spec 2026-08-18）。どちらも 1.0 未満で更新頻度が緩やかなため
# バージョンを固定する。API 破壊的変更とメンテナンス停滞のリスクを見込んでのこと。
little_exif = "=0.6.23"
img-parts = "=0.4.0"
# XMP パケット内をプロパティ単位で差し替えるためのパーサ。
# **0.37 系であることが重要**: little_exif 0.6.23 が quick-xml 0.37.5 に依存しており、
# 0.42 を足すと同じクレートの 2 版が同時にリンクされる（workspace Cargo.toml の S6-M19）。
quick-xml = "0.37"
# 入力専用の JPEG XL デコーダ。純 Rust（C ライブラリ不要）。
# `image` は image::ImageDecoder 実装を有効にする。`rayon` は入れない
# （1 枚の中は並列にしない。理由は core/src/decode/mod.rs の `jxl_decoder`）
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
# AVIF の AV1 デコーダ（C 版 libdav1d のバインディング）。壊れた入力を 1 枚の Err にするため
# avif-decode（rav1d）から差し替えた。**rav1d を依存に戻さない**: rav1d は `dav1d_open` などを
# 同じ名前の C ABI で公開しており、同居するとリンカーが黙って rav1d 側を使う
# （`cargo tree -p picture-tool-core -i rav1d` が空であること）。
# Linux はシステムの libdav1d（1.3 以上）を pkg-config で動的リンクする。Windows と CI は
# `SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always` で内部ビルドし、x86/x86_64 のアセンブリのため
# **そのビルドに nasm が要る**（README）
dav1d = "0.11"
# YUV→RGB 変換（core/src/decode/yuv.rs）。**SIMD を切ってスカラー経路に固定する**: SIMD 経路は
# 実行する CPU で出力が変わり（AVX2 とスカラーで 8bit 最大 2 階調）、画素一致を照合できない。
# 版を `=` で固定するのは、`cargo update` だけで丸めが変わって出力が変わりうるため。
# **ワークスペースの別クレートが既定 feature で `yuv` を足すと、feature の統合で SIMD が
# 黙って有効になり、画素一致のテストが AVX2 の機械で落ちる**
yuv = { version = "=0.8.19", default-features = false }
# 10/12bit の平面を `&[u16]` として読むため（image が既に依存している版）
bytemuck = "1"
# AVIF の画像データと色深度を取り出すため
avif-parse = "2"
# JPEG XL の Brotli 圧縮 Exif（`brob`）を上限つきで展開するため（jxl-oxide が使う版と揃える）
brotli-decompressor = "5"
# 出力 JPEG のエンコーダ（spec 2026-10-20「エンコーダ」）。量子化テーブル・ハフマン最適化・サンプリングを
# 自分で決めるため（`image` の JpegEncoder はどれも決められない）。既定（品質 90 未満で 4:2:0・`Nearest`・
# Annex K テーブル）には頼らず、`core/src/encode/mod.rs` で毎回明示する。`Custom` テーブルの受け取り方や
# APP セグメントの長さの判定に依存しているので版を固定する。ライセンスに IJG を含む（README）
jpeg-encoder = "=0.7.1"

[dev-dependencies]
tempfile = "3"
# spike（tests/rating_scan_spike.rs）でページキャッシュを落とすための posix_fadvise。
# **dev-dependency 限定**で、配布物には入らない
libc = "0.2"
# 統合テストから base64 のプレビュー出力をデコードして検証するため
base64 = "0.23"
