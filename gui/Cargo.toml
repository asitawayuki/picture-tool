[package]
name = "picture-tool-gui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
picture-tool-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt"] }
rayon.workspace = true

# OS のテーマ追従で xdg-desktop-portal を読むためだけに使う。
# tao 経由で既にビルド済みなので、依存木もビルド時間も増えない（theme.rs 参照）
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"

[dev-dependencies]
tempfile = "3"
# パス検証のテストで「中身も本物の画像」を用意するためだけに使う（バイナリには入らない）
image.workspace = true
# 保存の警告（MakerNote の位置の変化）が境界を通って届くかのテストで、MakerNote 付きの
# JPEG を作るためだけに使う。core と同じ版に固定する（依存木に既にあり、ビルドは増えない）
little_exif = "=0.6.23"

[build-dependencies]
tauri-build = { version = "2", features = [] }
